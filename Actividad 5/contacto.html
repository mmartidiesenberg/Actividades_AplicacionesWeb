    <main>
        <h1>
            Contacto
        </h1>
        <h2>Si te interesa una sesión o cobertura fotográfica escribime</h2>
        <form action="./contacto.html" method="post">

            <label for="id-nombre">Nombre</label>
            <input type="text" name="nombre" id="id-nombre">
            <label for="id-email">Email</label>
            <input type="email" name="email" id="id-email">

            <label for="id-telefono">Teléfono</label>
            <input type="telefono" name="telefono" id="id-telefono">
            <label for="id-fecha">Selecciona una fecha:</label>
            <input type="date" name="fecha" id="id-fecha">
           


            <label for="id-aclaraciones">Aclaraciones</label>
            <textarea name="aclaraciones" id="id-aclaraciones"></textarea>

            <button type="reset">Limpiar</button>
            <button type="submit">Enviar Consulta</button>
            <!-- <input type="button" value="Enviar">  -->
        </form>

        <h2>Dónde Estamos</h2>
