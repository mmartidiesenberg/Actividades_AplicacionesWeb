<!--DOCTYPE html le dice al navegador que este documento
usa HTML -->
<!DOCTYPE html>

<!--html lang es la raíz que envuelve todo el documento
y lang="es" indica que el contenido está en español -->
<html lang="es">

<head>
<!--Head contiene metadatos que no se ven-->

    <meta charset="UTF-8">
    <!--Meta charset define la codificación de caracteres, para que tildes, 
    ñ, emojis, etc. se muestren bien. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Meta name se usa para la página se vea bien en celulares, 
    ajustando el ancho al del dispositivo y el zoom inicial. -->

    <title>Document</title>
    <!--Título que aparece en la pestaña del navegador-->

</head>

<body>
<!--En Body va todo lo que se ve -->
 
        <h1>Bienvenidos</h1>
        <!--h1 es el título principal-->

        <h2>Los esperamos todos los días</h2>
        <!--h2 son subtítulos del primer nivel-->

            <h3>Servicio de Cafetería</h3>
            <!--h3 son subtítulos dentro de un h2-->
            <p>
                Preparamos cada café al momento, con granos seleccionados y métodos de filtrado tradicionales.
            </p>

            <h4>Horarios de Atención</h4>
            <!--h4 va bajando de nivel-->
            <p>
                Abrimos de lunes a sábado, de 8 a 20 horas.
            </p>
</body>

</html>
<!-- "index" es el nombre que los servidores web buscan automáticamente 
    cuando alguien entra a una carpeta o dominio sin especificar un archivo
    el servidor internamente busca un archivo llamado index dentro de esa 
    carpeta y lo carga solo, sin tener que escribir la ruta en la URL. -->
